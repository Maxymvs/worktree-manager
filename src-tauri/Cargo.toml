[package]
name = "grovr"
version = "0.8.0"
description = "Grovr - Git Worktree Manager Desktop App"
authors = ["Maxymvs"]
edition = "2024"

[lib]
name = "grovr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Grovr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# Tauri Plugins
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"

# Clipboard (main-thread-safe reading)
arboard = "3"

# Git operations (Phase 4)
# default-features = false drops git2's `ssh` + `https` features, which pull in
# libssh2-sys -> openssl-sys. We only use git2 for local repo reads
# (Repository::open, branches, head) — every network operation shells out to the
# `git` CLI instead. Keeping OpenSSL would break the universal build: Homebrew's
# OpenSSL is arm64-only, so the x86_64 half fails with "Could not find openssl
# via pkg-config: pkg-config has not been configured to support cross-compilation".
git2 = { version = "0.19", default-features = false }

# HTTP client for GitHub/Jira (Phase 5, 6)
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"

# Secure token storage using OS keychain
keyring = "3"

# Window vibrancy
window-vibrancy = "0.5"

# Liquid Glass (macOS 26+)
tauri-plugin-liquid-glass = "0.1"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
smappservice-rs = "0.1"

[dev-dependencies]
tempfile = "3"
